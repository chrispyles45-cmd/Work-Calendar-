<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift Calendar</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Calendar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 500px at 50% -5%, #1B1E27 0%, #0A0B0F 55%, #050609 100%);
    color: #EDEBE4;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #root { padding: 40px 16px 72px; display: flex; flex-direction: column; align-items: center; }
  .wrap { width: 100%; max-width: 440px; transition: max-width 0.2s ease; }
  .wrap.expanded { max-width: 780px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #7D818C; font-weight: 600; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow .line { width: 14px; height: 1px; background: #3A3D45; }
  .header-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 56px; line-height: 0.85; margin: 0; letter-spacing: 0.01em; color: #F5F3ED; }
  .year-wrap { position: relative; }
  .year-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #9A9EA8; background: transparent;
    border: none; border-bottom: 1.5px solid #33363F; cursor: pointer; padding-bottom: 2px; letter-spacing: 0.02em;
  }
  .year-popover {
    position: absolute; right: 0; top: calc(100% + 10px); z-index: 10;
    background: #15171D; border: 1px solid #272A33; border-radius: 14px;
    padding: 14px; width: 200px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .step-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .step-btn {
    width: 26px; height: 26px; border-radius: 6px; background: #1B1D24; border: 1px solid #272A33;
    color: #B8BCC6; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  #year-input {
    flex: 1; text-align: center; font-size: 18px; font-weight: 700;
    background: #0D0E12; border: 1px solid #272A33; border-radius: 8px;
    color: #F5F3ED; padding: 6px 4px; width: 0;
  }
  #year-input::-webkit-outer-spin-button, #year-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .quick-btn {
    font-size: 12.5px; padding: 7px 0; border-radius: 7px; background: #1B1D24; border: 1px solid #272A33;
    color: #B8BCC6; cursor: pointer; font-weight: 600;
  }
  .this-year-btn { width: 100%; margin-top: 6px; font-weight: 700; }
  .cycle-strip { display: flex; gap: 3px; margin-bottom: 8px; }
  .cycle-seg { flex: 1; height: 22px; border-radius: 4px; }
  .cycle-label { font-size: 11.5px; color: #6E727C; letter-spacing: 0.02em; margin-bottom: 24px; }
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
  .nav-btn {
    width: 38px; height: 38px; border-radius: 10px; background: #15171D; border: 1px solid #22242B;
    color: #EDEBE4; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .nav-btn.wide { width: auto; padding: 0 18px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #B8BCC6; }
  .nav-btn.expand-on { color: #15171D; background: #F5A623; border-color: #F5A623; gap: 8px; }
  .nav-group { display: flex; gap: 8px; }
  .dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .dow-cell { text-align: center; font-size: 10.5px; color: #565A64; font-weight: 700; letter-spacing: 0.1em; padding: 4px 0; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 26px; }
  .day-btn {
    position: relative; aspect-ratio: 1; border-radius: 9px; border: 1.5px solid transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    font-size: 13.5px; font-weight: 600; transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .day-btn:hover { filter: brightness(1.15); }
  .day-btn.selected {
    border-color: #F5F3ED;
    border-width: 2.5px;
    box-shadow: 0 0 0 3px rgba(245, 243, 237, 0.22), 0 4px 14px rgba(0, 0, 0, 0.45);
    transform: scale(1.06);
    z-index: 2;
  }
  .day-btn.today { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
  .marker-dot {
    position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%;
    z-index: 3; box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
  }
  .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .mini-month { background: #101116; border: 1px solid #1E2027; border-radius: 12px; padding: 12px 12px 14px; }
  .mini-title { font-size: 12.5px; font-weight: 800; color: #B8BCC6; margin-bottom: 8px; letter-spacing: 0.03em; }
  .mini-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; }
  .mini-dow-cell { text-align: center; font-size: 8px; color: #4A4D56; font-weight: 700; letter-spacing: 0.02em; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .mini-btn {
    position: relative; aspect-ratio: 1; border-radius: 3px; border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600;
  }
  .mini-btn:hover { filter: brightness(1.3); }
  .mini-btn.selected {
    border: 1.5px solid #F5F3ED;
    box-shadow: 0 0 0 2px rgba(245, 243, 237, 0.25);
    transform: scale(1.15);
    z-index: 2;
  }
  .mini-btn.today { border: 1px solid #4E9BFF; font-weight: 800; }
  .detail-card {
    background: linear-gradient(160deg, #15171D 0%, #101116 100%); border: 1px solid #22242B; border-radius: 16px;
    padding: 18px 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px;
  }
  .detail-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .detail-date { font-size: 12.5px; color: #7D818C; margin-bottom: 3px; }
  .detail-label { font-size: 17px; font-weight: 800; color: #F5F3ED; }
  .detail-sub { font-size: 12.5px; color: #7D818C; margin-top: 1px; }
  .badge-row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 8px; }
  .crew-card {
    background: linear-gradient(165deg, #15171D 0%, #101116 100%);
    border: 1px solid #22242B; border-radius: 16px;
    padding: 16px 18px; margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .crew-title {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8F94A0; font-weight: 700;
    margin-bottom: 12px; display: flex; align-items: center; gap: 7px;
  }
  .crew-title-icon { display: inline-flex; color: #565A64; flex-shrink: 0; }
  .crew-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #1C1E24; }
  .crew-row:first-of-type { border-top: none; padding-top: 2px; }
  .crew-name { font-size: 13.5px; font-weight: 600; color: #C8CBD3; }
  .crew-name.you { color: #F5F3ED; font-weight: 800; }
  .crew-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
  .section-divider {
    display: flex; align-items: center; gap: 10px; margin: 28px 0 14px;
  }
  .section-divider .line { flex: 1; height: 1px; background: linear-gradient(90deg, #22242B, transparent); }
  .section-divider .line.right { background: linear-gradient(270deg, #22242B, transparent); }
  .section-divider span {
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #6E727C; font-weight: 700; white-space: nowrap;
  }
  .legend-row {
    display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    background: #101116; border: 1px solid #1E2027; border-radius: 14px; padding: 14px 16px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend-text { font-size: 12.5px; color: #9A9EA8; font-weight: 500; }
  .legend-count { font-size: 12.5px; color: #565A64; }
  .picker-wrap { width: 100%; max-width: 380px; text-align: center; padding-top: 40px; }
  .picker-sub { font-size: 14px; color: #9A9EA8; margin-bottom: 26px; }
  .picker-list { display: flex; flex-direction: column; gap: 10px; }
  .picker-btn {
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: #F5F3ED;
    background: #15171D; border: 1px solid #272A33; border-radius: 12px; padding: 16px;
    cursor: pointer; text-align: left;
  }
  .picker-btn:hover { border-color: #F5A623; }
  .picker-cancel { margin-top: 16px; background: transparent; border: none; color: #7D818C; font-size: 13px; cursor: pointer; }
  .switch-link { background: transparent; border: none; color: #7D818C; font-size: 11px; text-decoration: underline; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  // ---- Shift rule ----
  // Cycle: 8 day shifts, 4 off, 7 afternoon shifts, 2 off = 21 day cycle
  // Anchor: July 31, 2026 is day 0 of the cycle (first day of an 8-day DAY block)
  var ANCHOR = new Date(2026, 6, 31);
  var CYCLE_LEN = 21;
  var CREWS = [
    { id: 'cj', label: 'Chris/CJ', abbr: 'CJ', anchor: new Date(2026, 6, 31), members: [{ id: 'cj_chris', name: 'Chris' }, { id: 'cj_cj', name: 'CJ' }] },
    { id: 'ab', label: 'Allen/Brad', abbr: 'AB', anchor: new Date(2026, 7, 7), members: [{ id: 'ab_allen', name: 'Allen' }, { id: 'ab_brad', name: 'Brad' }] },
    { id: 'bj', label: 'Bill/Justin', abbr: 'BJ', anchor: new Date(2026, 6, 24), members: [{ id: 'bj_bill', name: 'Bill' }, { id: 'bj_justin', name: 'Justin' }] },
  ];
  var CYCLE_SEGMENTS = [
    { len: 8, type: 'day' },
    { len: 4, type: 'off' },
    { len: 7, type: 'afternoon' },
    { len: 2, type: 'off' },
  ];

  function daysBetween(a, b) {
    var ms = 24 * 60 * 60 * 1000;
    var ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / ms);
  }

  function cycleIndexFor(anchor, date) {
    var idx = daysBetween(anchor, date) % CYCLE_LEN;
    if (idx < 0) idx += CYCLE_LEN;
    return idx;
  }

  function shiftFromIndex(idx) {
    if (idx <= 7) return 'day';
    if (idx <= 11) return 'off';
    if (idx <= 18) return 'afternoon';
    return 'off';
  }

  function cycleIndex(date) { return cycleIndexFor(ANCHOR, date); }
  function getShift(date) { return shiftFromIndex(cycleIndex(date)); }
  function getShiftForCrew(crew, date) { return shiftFromIndex(cycleIndexFor(crew.anchor, date)); }

  // ---- Front/Back role rotation ----
  // Each crew's two members swap "Front" and "Back" jobs every time they return
  // from their 4-day break (i.e. at the day-block -> afternoon-block transition).
  // They do NOT swap after the short 2-day break (afternoon-block -> day-block).
  // Calibrated to a known fixed date rather than "today" (which changes) so it stays
  // correct regardless of when someone opens the page.
  var ROLE_CALIBRATION_DATE = new Date(2026, 7, 19); // Aug 19, 2026
  var BACK_PERSON_AT_CALIBRATION = { cj: 'cj_chris', ab: 'ab_allen', bj: 'bj_justin' };

  function toggleCount(anchor, date) {
    var idx = cycleIndexFor(anchor, date);
    var cycleNum = Math.floor(daysBetween(anchor, date) / CYCLE_LEN);
    return cycleNum + (idx >= 12 ? 1 : 0);
  }
  function roleForPerson(crew, personId, date) {
    var backId = BACK_PERSON_AT_CALIBRATION[crew.id];
    if (!backId) return null;
    var diff = toggleCount(crew.anchor, date) - toggleCount(crew.anchor, ROLE_CALIBRATION_DATE);
    var sameParity = ((diff % 2) + 2) % 2 === 0;
    var isBackAtCalibration = personId === backId;
    var isBackNow = sameParity ? isBackAtCalibration : !isBackAtCalibration;
    return isBackNow ? 'Back' : 'Front';
  }

  var SHIFT_META = {
    day: { label: 'Day shift', sub: '7:00a – 3:00p', color: '#F5A623' },
    afternoon: { label: 'Afternoon shift', sub: '3:00p – 11:00p', color: '#5C7CFA' },
    midnight: { label: 'Midnight shift', sub: '11:00p – 7:00a', color: '#8B5CF6' },
    off: { label: 'Off', sub: 'No shift scheduled', color: '#454A58' },
    vacation: { label: 'On vacation', sub: 'Not scheduled (vacation)', color: '#B565E8' },
  };
  var PICKUP_TYPES = ['day', 'afternoon', 'midnight'];

  var HOLIDAY_COLOR = '#9CA3AF';
  var PAYDAY_COLOR = '#22C55E';
  var OPENING_COLOR = '#F5F3ED';
  var DANGER_COLOR = '#FF4D5E';
  var PAY_ANCHOR = new Date(2026, 6, 31); // today is a payday; repeats every 14 days

  function isPayday(date) {
    var diff = daysBetween(PAY_ANCHOR, date) % 14;
    if (diff < 0) diff += 14;
    return diff === 0;
  }

  // ---- Pay period + overtime/double-time calculation ----
  // Pay period = 14 days (two Mon\u2013Sun weeks), ending the Sunday before payday.
  // Rules (as confirmed): >8 hrs in a single day = OT; 6th consecutive day worked
  // in a Mon\u2013Sun week = all hours that day at 1.5x; 7th consecutive day worked
  // in that week = all hours that day at 2x (double time).
  var SHIFT_HOURS = 8;
  var SUNDAY_PREMIUM_RATE = 2.50; // per hour, any hours worked on a Sunday
  var DEFAULT_RATE_HISTORY = [
    { id: 'r0', effective: Date.UTC(2020, 0, 1), rate: 37.97 },
    { id: 'r1', effective: Date.UTC(2026, 5, 1), rate: 42.09 }, // confirmed raise, effective Jun 1, 2026
  ];
  var PERIOD_REF_START = new Date(2026, 6, 13); // a known period start (Monday)
  var PERIOD_LEN = 14;

  function periodContaining(date) {
    var diff = daysBetween(PERIOD_REF_START, date);
    var periodIndex = Math.floor(diff / PERIOD_LEN);
    var start = new Date(PERIOD_REF_START);
    start.setDate(start.getDate() + periodIndex * PERIOD_LEN);
    var end = new Date(start);
    end.setDate(end.getDate() + 13);
    return { start: start, end: end };
  }

  function computePayPeriodHours(periodStart) {
    var weeks = [[], []];
    for (var i = 0; i < 14; i++) {
      var d = new Date(periodStart);
      d.setDate(d.getDate() + i);
      weeks[Math.floor(i / 7)].push(d);
    }

    var totals = { regular: 0, overtime: 0, doubleTime: 0, sundayHours: 0, vacationHours: 0 };
    var days = [];
    var myCrewObjForPay = getCrew(state.myCrew);

    weeks.forEach(function (week) {
      // Flat 40 hrs of vacation pay for any week that includes a vacation day \u2014 confirmed
      // from your real stubs (40 hrs \u00d7 $42.09 = $1,683.60 showed up exactly this way).
      // This is separate from worked hours/ordinal \u2014 vacation days still contribute 0 toward
      // the 6th/7th-day tally and 0 actual worked hours, same as before.
      var weekHasVacation = week.some(function (d) { return isPersonOnVacation(MY_PERSON_ID, d); });
      if (weekHasVacation) totals.vacationHours += 40;

      var workedOrdinal = 0;
      week.forEach(function (date) {
        // Raw rotation shift, ignoring vacation/trades \u2014 this is what determines whether the
        // day counts toward your weekly worked-day tally (a traded-away day still counts, since
        // it was still "your" scheduled day \u2014 you just had someone else physically cover it).
        var rawShift = myCrewObjForPay ? getShiftForCrew(myCrewObjForPay, date) : 'off';
        var rawScheduledDayOrAfternoon = rawShift === 'day' || rawShift === 'afternoon';
        var isVac = isPersonOnVacation(MY_PERSON_ID, date);
        var isTraded = isTradedAway(date);
        var pickups = getPickups(date);

        // Counts toward the weekly 6th/7th-day tally: your normal rotation day (unless you're on
        // vacation \u2014 vacation genuinely removes you from the tally, unlike a trade), or any day
        // you picked up a shift on.
        var countsForOrdinal = (rawScheduledDayOrAfternoon && !isVac) || pickups.length > 0;

        // Actual hours paid: only for shifts you really worked (not vacation, not traded away),
        // plus any pickups that aren't just a redundant duplicate of that scheduled shift.
        var scheduledWorkedForHours = rawScheduledDayOrAfternoon && !isVac && !isTraded;
        var effectiveBaseType = scheduledWorkedForHours ? rawShift : null;
        var extraPickups = pickups.filter(function (p) { return p.type !== effectiveBaseType; });
        var hrs = (scheduledWorkedForHours ? SHIFT_HOURS : 0) + extraPickups.length * SHIFT_HOURS;
        var isTradeDay = pickups.some(function (p) { return p.fromTrade; }) || isTradePickupDate(date);

        var displayShift = isVac ? 'vacation' : (scheduledWorkedForHours ? rawShift : (pickups.length ? pickups[0].type : 'off'));
        var entry = {
          date: date, worked: countsForOrdinal, shift: displayShift, pickups: pickups,
          regular: 0, overtime: 0, doubleTime: 0, hours: hrs,
        };

        if (countsForOrdinal) {
          workedOrdinal++;
          var isHol = isHolidayDate(date);
          if (workedOrdinal === 7) {
            entry.doubleTime = hrs;
          } else if (workedOrdinal === 6 || isHol) {
            entry.overtime = hrs;
          } else if (isTradeDay) {
            // Trade-driven double: not treated as "working over 8 hrs" \u2014 it's a swap, not extra hours.
            entry.regular = hrs;
          } else {
            // No trade involved: hours beyond 8 on this day are daily overtime.
            entry.regular = Math.min(hrs, 8);
            entry.overtime = Math.max(0, hrs - 8);
          }
          totals.regular += entry.regular;
          totals.overtime += entry.overtime;
          totals.doubleTime += entry.doubleTime;
          if (date.getDay() === 0) totals.sundayHours += hrs;
        }
        days.push(entry);
      });
    });

    return { totals: totals, days: days };
  }

  function computeYTDHours(uptoDate) {
    var year = uptoDate.getFullYear();
    var firstPeriod = periodContaining(new Date(year, 0, 1));
    var targetPeriod = periodContaining(uptoDate);
    var totals = { regular: 0, overtime: 0, doubleTime: 0, vacationHours: 0 };
    var periodCount = 0;
    var cursor = new Date(firstPeriod.start);
    while (cursor.getTime() <= targetPeriod.start.getTime()) {
      var r = computePayPeriodHours(cursor);
      totals.regular += r.totals.regular;
      totals.overtime += r.totals.overtime;
      totals.doubleTime += r.totals.doubleTime;
      totals.vacationHours += r.totals.vacationHours || 0;
      periodCount++;
      cursor.setDate(cursor.getDate() + 14);
    }
    return { totals: totals, periodCount: periodCount, from: firstPeriod.start, through: targetPeriod.end };
  }

  function computeGrossPay(totals, periodStart) {
    var baseRate = getBaseRateFor(periodStart);
    var otRate = baseRate * 1.5;
    var dtRate = baseRate * 2;
    var regularPay = totals.regular * baseRate;
    var otPay = totals.overtime * otRate;
    var dtPay = totals.doubleTime * dtRate;
    var sundayPay = totals.sundayHours * SUNDAY_PREMIUM_RATE;
    var vacationPay = (totals.vacationHours || 0) * baseRate;
    return {
      baseRate: baseRate, otRate: otRate, dtRate: dtRate,
      regularPay: regularPay, otPay: otPay, dtPay: dtPay, sundayPay: sundayPay, vacationPay: vacationPay,
      total: regularPay + otPay + dtPay + sundayPay + vacationPay,
    };
  }

  // ---- Take-home pay + 401k ----
  // Federal/state withholding modeled as linear functions of gross pay (IRS percentage-method
  // withholding is progressive, so a flat % badly over/under-shoots on unusual OT periods).
  // Fit via linear regression across 7 real pay stubs spanning ~$3,966\u2013$10,893 gross.
  // These parts are fixed (statutory or fitted); the deduction amounts below are user-editable.
  var FIXED_PAY_RATES = {
    k401EmployerMatchRatio: 1 / 3,  // employer $ per employee $ (confirmed exactly 1/3 across stubs)
    oasdiRate: 0.062,               // statutory
    medicareRate: 0.0145,           // statutory
    fedSlope: 0.22464,
    fedIntercept: -437.28,
    stateSlope: 0.03139,
    stateIntercept: -37.05,
  };
  var DEFAULT_PAY_SETTINGS = {
    k401EmployeeRate: 0.11937, // Traditional 401K / gross \u2014 pre-tax, reduces taxable income
    rothK401Rate: 0,           // Roth 401K / gross \u2014 post-tax, does NOT reduce taxable income
    dental: 3.23,
    medical: 30.00,
    hsa: 70.00,
    unionAvg: 30.00, // Union Dues \u2014 alternates ~$60/$0 by period, averages to ~$30
  };

  function computeTakeHome(grossTotal) {
    var ps = state.paySettings;
    var flatPreTax = ps.dental + ps.medical + ps.hsa;
    var k401Traditional = grossTotal * ps.k401EmployeeRate;
    var k401Roth = grossTotal * (ps.rothK401Rate || 0);
    // Employer match applies to combined Traditional + Roth employee deferral (standard behavior);
    // the match itself lands in a pre-tax account regardless of which bucket the employee chose.
    var k401Employer = (k401Traditional + k401Roth) * FIXED_PAY_RATES.k401EmployerMatchRatio;
    var ficaBase = Math.max(0, grossTotal - flatPreTax);
    var oasdi = ficaBase * FIXED_PAY_RATES.oasdiRate;
    var medicare = ficaBase * FIXED_PAY_RATES.medicareRate;
    // Fed/state withholding is only reduced by the Traditional side \u2014 Roth is post-tax, so it does
    // NOT lower taxable wages (that's the whole point of Roth). The fitted model below is calibrated

      var raw = localStorage.getItem('shiftcal_trades');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveTrades() {
    try { localStorage.setItem('shiftcal_trades', JSON.stringify(state.trades)); } catch (e) {}
  }
  // True if any logged trade says you're covering this date (the source of truth for trade days).
  function isTradePickupDate(date) {
    var key = dateKey(date);
    return state.trades.some(function (t) { return dateKeyFromInputStr(t.pickup) === key; });
  }
  function dateKeyFromInputStr(s) {
    var d = new Date(s + 'T00:00:00');
    return dateKey(d);
  }
  function addTrade(withName, giveStr, pickupStr, pickupShift) {
    if (!giveStr || !pickupStr || !pickupShift) return false;
    var g = new Date(giveStr + 'T00:00:00');
    var p = new Date(pickupStr + 'T00:00:00');
    if (isNaN(g.getTime()) || isNaN(p.getTime())) return false;
    var id = 'trade' + Date.now();
    state.trades.push({ id: id, withName: (withName || '').trim(), give: giveStr, pickup: pickupStr, pickupShift: pickupShift });

    var gKey = dateKeyFromInputStr(giveStr);
    state.tradedAway[gKey] = id;

    var pKey = dateKeyFromInputStr(pickupStr);
    var list = state.pickups[pKey] || [];
    if (!list.some(function (p) { return p.type === pickupShift && p.tradeId === id; })) {
      list = list.concat([{ type: pickupShift, fromTrade: true, tradeId: id }]);
    }
    state.pickups[pKey] = list;

    saveTrades(); saveTradedAway(); savePickups();
    return true;
  }
  function removeTrade(id) {
    var t = state.trades.find(function (x) { return x.id === id; });
    if (!t) return;
    state.trades = state.trades.filter(function (x) { return x.id !== id; });

    var gKey = dateKeyFromInputStr(t.give);
    if (state.tradedAway[gKey] === id) delete state.tradedAway[gKey];

    var pKey = dateKeyFromInputStr(t.pickup);
    var list = (state.pickups[pKey] || []).filter(function (p) { return p.tradeId !== id; });
    if (list.length) state.pickups[pKey] = list; else delete state.pickups[pKey];

    saveTrades(); saveTradedAway(); savePickups();
  }

  function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render() {
    var root = document.getElementById('root');
    var holidayMap = buildHolidayMap(state.viewYear);
    function holidayName(date) { return holidayMap[dateKey(date)] || null; }
    var fmtShort = function (d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };

    var selectedShift = myEffectiveShift(state.selected);
    var selIdx = myCycleIndex(state.selected);

    var html = '';
    html += '<div class="wrap' + (state.expanded ? ' expanded' : '') + '">';

    // Eyebrow
    html += '<div class="eyebrow"><span class="line"></span>Rotation · 8 on · 4 off · 7 on · 2 off</div>';
    html += '<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">';
    html += '<span style="font-size:11px;color:#7D818C;">Saved on this device \u00b7 build 11-02b</span>';
    html += '<button class="switch-link" id="export-data-btn" style="margin-left:auto;">Export data</button>';
    html += '<button class="switch-link" id="import-data-btn">Import data</button>';
    html += '<input type="file" id="import-file-input" accept="application/json" style="display:none;">';
    html += '</div>';

    // Header
    html += '<div class="header-row">';
    html += '<h1>' + (state.expanded ? 'Year overview' : MONTH_NAMES[state.viewMonth]) + '</h1>';
    html += '<div class="year-wrap" id="year-wrap">';
    html += '<button class="year-btn" id="year-toggle-btn">' + state.viewYear + '</button>';
    if (state.yearPickerOpen) {
      html += '<div class="year-popover" id="year-popover">';
      html += '<div class="step-row">';
      html += '<button class="step-btn" id="year-step-down">' + ICON.chevronDown + '</button>';
      html += '<input type="number" id="year-input" value="' + state.viewYear + '" />';
      html += '<button class="step-btn" id="year-step-up">' + ICON.chevronUp + '</button>';
      html += '</div>';
      html += '<div class="quick-grid">';
      [-5, -1, 1, 5].forEach(function (off) {
        html += '<button class="quick-btn" data-year-off="' + off + '">' + (off > 0 ? '+' + off : off) + '</button>';
      });
      html += '</div>';
      html += '<button class="quick-btn this-year-btn" id="year-this-year">This year</button>';
      html += '</div>';
    }
    html += '</div></div>';

    // Cycle strip
    html += '<div class="cycle-strip">';
    for (var ci = 0; ci < CYCLE_LEN; ci++) {
      var type = 'off', acc = 0;
      for (var s = 0; s < CYCLE_SEGMENTS.length; s++) {
        if (ci < acc + CYCLE_SEGMENTS[s].len) { type = CYCLE_SEGMENTS[s].type; break; }
        acc += CYCLE_SEGMENTS[s].len;
      }
      var marked = ci === selIdx;
      var bg = type === 'off' ? '#22242B' : SHIFT_META[type].color;
      html += '<div class="cycle-seg" style="background:' + bg + ';opacity:' + (type === 'off' ? 1 : 0.85) + ';outline:' + (marked ? '2px solid #F5F3ED' : 'none') + ';outline-offset:1px;"></div>';
    }
    html += '</div>';
    html += '<div class="cycle-label">Day ' + (selIdx + 1) + ' of ' + CYCLE_LEN + ' in the rotation — ' + SHIFT_META[selectedShift].label.toLowerCase() + '</div>';

    // Nav row
    html += '<div class="nav-row">';
    html += '<button class="nav-btn" id="nav-prev">' + ICON.chevronLeft + '</button>';
    html += '<div class="nav-group">';
    html += '<button class="nav-btn wide" id="nav-today">Today</button>';
    html += '<button class="nav-btn wide' + (state.expanded ? ' expand-on' : '') + '" id="nav-expand">' + (state.expanded ? ICON.calendarDays : ICON.layoutGrid) + '&nbsp;' + (state.expanded ? 'Month view' : 'Full year') + '</button>';
    html += '</div>';
    html += '<button class="nav-btn" id="nav-next">' + ICON.chevronRight + '</button>';
    html += '</div>';

    if (!state.expanded) {
      // Weekday row
      html += '<div class="dow-row">';
      DOW.forEach(function (d) { html += '<div class="dow-cell">' + d + '</div>'; });
      html += '</div>';

      // Month grid
      var grid = buildMonthGrid(state.viewYear, state.viewMonth);
      var counts = { day: 0, afternoon: 0, off: 0 };
      grid.forEach(function (d) { if (d) counts[myShift(d)]++; });

      html += '<div class="month-grid">';
      grid.forEach(function (date) {
        if (!date) { html += '<div></div>'; return; }
        var shift = myEffectiveShift(date);
        var meta = SHIFT_META[shift];
        var isToday = isSameDay(date, today);
        var isSelected = isSameDay(date, state.selected);
        var hName = holidayName(date);
        var pDay = isPayday(date);
        var opens = getOtherCrewOpenings(date);
        var hasOpening = opens.length > 0;
        var hasNote = !!getNote(date);
        var datePickups = getPickups(date);
        var hasPickup = datePickups.length > 0;
        var workedTypes = myWorkedShiftTypes(date);
        var isDouble = workedTypes.length > 1;
        var hasMarker = hName || pDay || hasOpening || isDouble;
        var baseColor = shift === 'off' ? '#15171D' : meta.color;
        var accents = [];
        if (isDouble) { baseColor = SHIFT_META[workedTypes[0]].color; workedTypes.slice(1).forEach(function (t) { accents.push(SHIFT_META[t].color); }); }
        if (hName) accents.push(HOLIDAY_COLOR);
        if (pDay) accents.push(PAYDAY_COLOR);
        if (hasOpening) accents.push(OPENING_COLOR);
        var bg = buildSplitBackground(baseColor, accents);
        var textColor = hasMarker ? '#15171D' : (shift === 'off' ? '#6E727C' : '#15171D');
        var textShadow = hasMarker ? '0 0 3px rgba(245,243,237,0.5)' : 'none';
        var titleAttr = [];
        if (isDouble) titleAttr.push('Double: ' + workedTypes.map(function (t) { return SHIFT_META[t].label; }).join(' + '));
        if (hName) titleAttr.push(hName);
        if (pDay) titleAttr.push('Payday');
        if (hasOpening) titleAttr.push(opens.map(function (o) {
          return (o.shift === 'day' ? 'Day' : 'Afternoon') + ' shift needs ' + o.needed + ' (' +
            o.missing.map(function (m) { return m.name + ' (' + roleForPerson(o.crew, m.id, date) + ')'; }).join(', ') + ' out)';
        }).join(', '));
        if (hasNote) titleAttr.push('Note added');
        if (hasPickup) titleAttr.push('Picked up: ' + datePickups.join(', '));
        html += '<button class="day-btn' + (isSelected ? ' selected' : '') + (isToday ? ' today' : '') +
          '" data-ts="' + date.getTime() + '" title="' + escapeAttr(titleAttr.join(' · ')) +
          '" style="background:' + bg + ';color:' + textColor + ';text-shadow:' + textShadow + ';opacity:' + (shift === 'off' && !hasMarker ? 1 : (isSelected || hasMarker ? 1 : 0.88)) + ';">' +
          date.getDate() +
          (hasNote ? '<span class="marker-dot" style="top:auto;bottom:3px;left:3px;right:auto;background:#F5F3ED;"></span>' : '') +
          (hasPickup ? '<span class="marker-dot" style="top:auto;bottom:3px;right:3px;left:auto;background:' + SHIFT_META.midnight.color + ';"></span>' : '') +
          '</button>';
      });
      html += '</div>';
    } else {
      // Year overview grid
      html += '<div class="year-grid">';
      for (var mIdx = 0; mIdx < 12; mIdx++) {
        var miniGrid = buildMonthGrid(state.viewYear, mIdx);
        html += '<div class="mini-month"><div class="mini-title">' + MONTH_SHORT[mIdx] + '</div>';
        html += '<div class="mini-dow-row">';
        DOW.forEach(function (d) { html += '<div class="mini-dow-cell">' + d + '</div>'; });
        html += '</div>';
        html += '<div class="mini-grid">';
        miniGrid.forEach(function (date) {
          if (!date) { html += '<div></div>'; return; }
          var shift = myEffectiveShift(date);
          var meta = SHIFT_META[shift];
          var isToday = isSameDay(date, today);
          var isSelected = isSameDay(date, state.selected);
          var hName = holidayName(date);
          var pDay = isPayday(date);
          var opens = getOtherCrewOpenings(date);
          var hasOpening = opens.length > 0;
          var miniWorkedTypes = myWorkedShiftTypes(date);
          var miniIsDouble = miniWorkedTypes.length > 1;
          var hasMarker = hName || pDay || hasOpening || miniIsDouble;
          var miniBase = shift === 'off' ? '#20222A' : meta.color;
          var miniAccents = [];
          if (miniIsDouble) { miniBase = SHIFT_META[miniWorkedTypes[0]].color; miniWorkedTypes.slice(1).forEach(function (t) { miniAccents.push(SHIFT_META[t].color); }); }
          if (hName) miniAccents.push(HOLIDAY_COLOR);
          if (pDay) miniAccents.push(PAYDAY_COLOR);
          if (hasOpening) miniAccents.push(OPENING_COLOR);
          var bg = buildSplitBackground(miniBase, miniAccents);
          var textColor = hasMarker ? '#15171D' : (shift === 'off' ? '#6E727C' : '#15171D');
          var textShadow = hasMarker ? '0 0 2px rgba(245,243,237,0.5)' : 'none';
          var titleAttr = [MONTH_SHORT[mIdx] + ' ' + date.getDate()];
          if (miniIsDouble) titleAttr.push('Double shift');
          if (hName) titleAttr.push(hName);
          if (pDay) titleAttr.push('Payday');
          if (hasOpening) titleAttr.push(opens.map(function (o) { return o.shift + ' needs ' + o.needed; }).join(', '));
          if (getNote(date)) titleAttr.push('Note added');
          titleAttr.push(meta.label);
          html += '<button class="mini-btn' + (isSelected ? ' selected' : '') + (isToday ? ' today' : '') +
            '" data-ts="' + date.getTime() + '" data-mini="1" title="' + escapeAttr(titleAttr.join(' — ')) +
            '" style="background:' + bg + ';color:' + textColor + ';text-shadow:' + textShadow + ';opacity:' + (shift === 'off' && !hasMarker ? 1 : 0.9) + ';">' +
            date.getDate() + '</button>';
        });
        html += '</div></div>';
      }
      html += '</div>';
    }

    // Detail card
    var selHoliday = holidayName(state.selected);
    var selPayday = isPayday(state.selected);
    html += '<div class="detail-card">';
    html += '<div class="detail-icon" style="background:' + (selectedShift === 'off' ? '#22242B' : SHIFT_META[selectedShift].color) + ';">';
    if (selectedShift === 'day') html += sunIcon('#15171D', 20);
    else if (selectedShift === 'afternoon') html += moonIcon('#15171D', 20);
    else if (selectedShift === 'vacation') html += '<span style="font-size:16px;">\u2708\ufe0f</span>';
    else html += '<span style="font-size:18px;color:#565A64;">—</span>';
    html += '</div>';
    html += '<div>';
    html += '<div class="detail-date">' + state.selected.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + '</div>';
    html += '<div class="detail-label">' + SHIFT_META[selectedShift].label + '</div>';
    html += '<div class="detail-sub">' + SHIFT_META[selectedShift].sub + '</div>';
    var selOpenings = getOtherCrewOpenings(state.selected);
    if (selHoliday || selPayday || selOpenings.length) {
      html += '<div class="badge-row">';
      if (selHoliday) html += '<div class="badge" style="color:#15171D;background:' + HOLIDAY_COLOR + ';">' + selHoliday + '</div>';
      if (selPayday) html += '<div class="badge" style="color:#F5F3ED;background:#22242B;"><span style="width:5px;height:5px;border-radius:50%;background:' + PAYDAY_COLOR + ';"></span>Payday</div>';
      selOpenings.forEach(function (o) {
        var whoText = o.missing.map(function (m) { return m.name + ' (' + roleForPerson(o.crew, m.id, state.selected) + ')'; }).join(' & ') + ' out';
        html += '<div class="badge" style="color:#15171D;background:' + OPENING_COLOR + ';">' +
          (o.shift === 'day' ? 'Day' : 'Afternoon') + ' short ' + o.needed + ' (' + o.crew.label + ': ' + whoText + ')</div>';
      });
      html += '</div>';
    }
    html += '</div></div>';

    // Shift changes: picked up extra shifts, and/or gave away a scheduled one (trades)
    var selPickups = getPickups(state.selected);
    var myCrewObj = getCrew(state.myCrew);
    var selRawShift = myCrewObj ? getShiftForCrew(myCrewObj, state.selected) : 'off';
    var selIsTraded = isTradedAway(state.selected);
    html += '<div class="crew-card">';
    html += '<div class="crew-title">' + cardIcon('briefcase') + 'Shift changes on this day</div>';

    html += '<div style="font-size:11px;color:#9A9EA8;font-weight:600;margin-bottom:6px;">Picked up a shift?</div>';
    html += '<div style="display:flex;gap:6px;">';
    PICKUP_TYPES.forEach(function (type) {
      var active = selPickups.some(function (p) { return p.type === type; });
      html += '<button class="quick-btn" data-toggle-pickup="' + type + '" style="flex:1;' +
        (active ? 'border-color:' + SHIFT_META[type].color + ';color:#F5F3ED;background:' + SHIFT_META[type].color + '22;' : '') +
        '">' + (type === 'day' ? 'Day' : type === 'afternoon' ? 'Afternoon' : 'Midnight') + '</button>';
    });
    html += '</div>';
    var selTradePickups = selPickups.filter(function (p) { return p.fromTrade; });
    if (selTradePickups.length) {
      html += '<div style="font-size:11px;color:#7D818C;margin-top:6px;">From a trade \u2014 manage it in Shift Trades below instead.</div>';
    }
    var selBaseRaw = myScheduledShiftForPay(state.selected);
    var selScheduledShift = (selBaseRaw === 'day' || selBaseRaw === 'afternoon') ? selBaseRaw : null;
    var selExtraPickups = selPickups.filter(function (p) { return p.type !== selScheduledShift; });
    if (selPickups.length) {
      var selDuplicate = selPickups.length - selExtraPickups.length;
      html += '<div style="font-size:11.5px;color:#7D818C;margin-top:8px;">+' + (selExtraPickups.length * SHIFT_HOURS) +
        ' extra hour' + (selExtraPickups.length * SHIFT_HOURS === 1 ? '' : 's') + ' added to this day\u2019s pay period total.' +
        (selDuplicate > 0 ? ' (' + selDuplicate + ' pickup matches your already-scheduled shift, so it doesn\u2019t add extra hours.)' : '') + '</div>';
    }

    if (selIsTraded) {
      var selTrade = state.trades.find(function (tr) { return dateKeyFromInputStr(tr.give) === dateKey(state.selected); });
      html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #1E2027;">';
      html += '<div style="font-size:11.5px;color:' + DANGER_COLOR + ';">Traded away' + (selTrade && selTrade.withName ? ' to ' + escapeHtml(selTrade.withName) : '') + ' \u2014 manage it in Shift Trades below.</div>';
      html += '</div>';
    }
    html += '</div>';

    // Shift Trades (combined log: one action updates both sides)
    html += '<div class="crew-card">';
    html += '<div class="crew-title" style="display:flex;align-items:center;justify-content:space-between;"><span>' + cardIcon('users') + 'Shift trades</span><button class="switch-link" id="trades-btn">' + (state.tradePanelOpen ? 'Close' : 'Log a trade') + '</button></div>';
    var tradeTodayTs = dateOnlyTs(today);
    var isTradePast = function (tr) {
      var latest = Math.max(dateOnlyTs(new Date(tr.give + 'T00:00:00')), dateOnlyTs(new Date(tr.pickup + 'T00:00:00')));
      return latest < tradeTodayTs;
    };
    var upcomingTrades = state.trades.filter(function (tr) { return !isTradePast(tr); });
    var pastTrades = state.trades.filter(isTradePast);
    var tradesToShow = (state.tradeShowPast ? state.trades.slice() : upcomingTrades)
      .sort(function (a, b) { return new Date(b.give) - new Date(a.give); });
    if (tradesToShow.length === 0) {
      html += '<div style="font-size:12.5px;color:#7D818C;">' + (pastTrades.length && !state.tradeShowPast ? 'No upcoming trades.' : 'No trades logged.') + '</div>';
    } else {
      tradesToShow.forEach(function (tr) {
        var gDate = new Date(tr.give + 'T00:00:00');
        var pDate = new Date(tr.pickup + 'T00:00:00');
        html += '<div class="crew-row">';
        html += '<span class="crew-name">Gave <b>' + fmtShort(gDate) + '</b>' + (tr.withName ? ' to ' + escapeHtml(tr.withName) : '') +
          '<br><span style="color:#7D818C;font-weight:500;">Covering ' + fmtShort(pDate) + ' (' + SHIFT_META[tr.pickupShift].label + ') instead</span></span>';
        html += '<button class="switch-link" data-remove-trade="' + tr.id + '" style="color:' + DANGER_COLOR + ';">Remove</button>';
        html += '</div>';
      });
    }
    if (pastTrades.length > 0) {
      html += '<button class="switch-link" id="toggle-trade-past-btn" style="margin-top:8px;">' +
        (state.tradeShowPast ? 'Hide past' : 'Show past (' + pastTrades.length + ')') + '</button>';
    }
    if (state.tradePanelOpen) {
      html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #1E2027;display:flex;flex-direction:column;gap:8px;">';
      html += '<input type="text" id="trade-name" placeholder="Who\u2019s covering for you? (optional)" style="width:100%;box-sizing:border-box;background:#0D0E12;border:1px solid #272A33;border-radius:8px;color:#F5F3ED;padding:9px;font-size:13px;">';
      html += '<div>';
      html += '<div style="font-size:11px;color:#9A9EA8;margin-bottom:4px;">Day you gave away</div>';
      html += '<input type="date" id="trade-give-date" style="width:100%;box-sizing:border-box;background:#0D0E12;border:1px solid #272A33;border-radius:8px;color:#F5F3ED;padding:9px;font-size:13px;">';
      html += '</div>';
      html += '<div>';
      html += '<div style="font-size:11px;color:#9A9EA8;margin-bottom:4px;">Day you\u2019re covering instead</div>';
      html += '<input type="date" id="trade-pickup-date" style="width:100%;box-sizing:border-box;background:#0D0E12;border:1px solid #272A33;border-radius:8px;color:#F5F3ED;padding:9px;font-size:13px;">';
      html += '</div>';
      html += '<div>';
      html += '<div style="font-size:11px;color:#9A9EA8;margin-bottom:6px;">Shift you\u2019re covering</div>';
      html += '<div style="display:flex;gap:6px;">';
      PICKUP_TYPES.forEach(function (type, i) {
        var picked = state._tradeShiftDraft === type || (!state._tradeShiftDraft && i === 0);
        html += '<button class="quick-btn" data-trade-shift="' + type + '" style="flex:1;' +
          (picked ? 'border-color:' + SHIFT_META[type].color + ';color:#F5F3ED;' : '') +
          '">' + (type === 'day' ? 'Day' : type === 'afternoon' ? 'Afternoon' : 'Midnight') + '</button>';
      });
      html += '</div></div>';
      html += '<button class="quick-btn" id="trade-save-btn" style="width:100%;font-weight:700;margin-top:4px;">Save trade</button>';
      html += '</div>';
    }
    html += '</div>';

    // Daily note
    var existingNote = getNote(state.selected);
    html += '<div class="crew-card">';
    html += '<div class="crew-title">' + cardIcon('pencil') + 'Note for this day</div>';
    html += '<textarea id="note-input" placeholder="e.g. Covered the shift for Allen" style="width:100%;min-height:64px;background:#0D0E12;border:1px solid #272A33;border-radius:8px;color:#F5F3ED;padding:10px;font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box;">' + escapeHtml(existingNote) + '</textarea>';
    html += '<div style="display:flex;gap:8px;margin-top:8px;">';
    html += '<button class="quick-btn" id="note-save-btn" style="flex:1;font-weight:700;">Save note</button>';
    if (existingNote) html += '<button class="quick-btn" id="note-clear-btn" style="color:' + DANGER_COLOR + ';">Clear</button>';
    html += '</div></div>';

    // Crew status — who's working this day across all 3 crews
    html += '<div class="crew-card"><div class="crew-title" style="display:flex;align-items:center;justify-content:space-between;">';
    html += '<span>' + cardIcon('users') + 'Who is working</span><button class="switch-link" id="vacations-btn">Vacations</button></div>';
    CREWS.forEach(function (crew) {
      var raw = getShiftForCrew(crew, state.selected);
      var cs = effectiveShiftForCrew(crew, state.selected);
      var meta = SHIFT_META[cs];
      var pillBg = (cs === 'off') ? '#22242B' : meta.color;
      var pillColor = (cs === 'off') ? '#7D818C' : '#15171D';
      var isYou = crew.id === state.myCrew;
      var missing = membersOnVacation(crew, state.selected);
      html += '<div class="crew-row" style="align-items:flex-start;">';
      html += '<span class="crew-name' + (isYou ? ' you' : '') + '">' + crew.label + (isYou ? ' (you)' : '');
      var present = crew.members.filter(function (m) { return missing.indexOf(m) === -1; });
      var roleLine = present.map(function (m) { return m.name + ' (' + roleForPerson(crew, m.id, state.selected) + ')'; }).join(' \u00b7 ');
      if (roleLine) html += '<br><span style="font-size:11px;font-weight:500;color:#7D818C;">' + roleLine + '</span>';
      if (!isYou && missing.length && cs !== 'vacation') {
        html += '<br><span style="font-size:11px;font-weight:500;color:' + DANGER_COLOR + ';">' +

      render(); return;
    }
    if ((el = t.closest('[data-vac-person]'))) {
      state._vacPersonDraft = el.getAttribute('data-vac-person');
      render(); return;
    }
    if ((el = t.closest('#vac-add-btn'))) {
      var startEl = document.getElementById('vac-start');
      var endEl = document.getElementById('vac-end');
      var personId = state._vacPersonDraft;
      var sVal = startEl ? startEl.value : '';
      var eVal = endEl ? endEl.value : '';
      var ok;
      if (state._vacEditingId) {
        ok = personId ? updateVacation(state._vacEditingId, personId, sVal, eVal) : false;
      } else {
        ok = personId ? addVacation(personId, sVal, eVal) : false;
      }
      if (ok) {
        state._vacPersonDraft = null; state._vacStartDraft = null; state._vacEndDraft = null; state._vacEditingId = null;
        render();
      }
      return;
    }
    if ((el = t.closest('#vac-cancel-edit-btn'))) {
      state._vacEditingId = null; state._vacPersonDraft = null; state._vacStartDraft = null; state._vacEndDraft = null;
      render(); return;
    }
    if ((el = t.closest('[data-edit-vacation]'))) {
      var editId = el.getAttribute('data-edit-vacation');
      var v = state.vacations.find(function (v) { return v.id === editId; });
      if (v) {
        state._vacEditingId = editId;
        state._vacPersonDraft = v.personId;
        state._vacStartDraft = toInputDateStr(new Date(v.start));
        state._vacEndDraft = toInputDateStr(new Date(v.end));
        render();
      }
      return;
    }
    if ((el = t.closest('[data-remove-vacation]'))) {
      removeVacation(el.getAttribute('data-remove-vacation'));
      if (state._vacEditingId === el.getAttribute('data-remove-vacation')) {
        state._vacEditingId = null; state._vacPersonDraft = null; state._vacStartDraft = null; state._vacEndDraft = null;
      }
      render(); return;
    }
    if ((el = t.closest('[data-toggle-pickup]'))) {
      togglePickup(state.selected, el.getAttribute('data-toggle-pickup'));
      render(); return;
    }
    if ((el = t.closest('#toggle-vac-past-btn'))) {
      state.vacationShowPast = !state.vacationShowPast;
      render(); return;
    }
    if ((el = t.closest('#toggle-trade-past-btn'))) {
      state.tradeShowPast = !state.tradeShowPast;
      render(); return;
    }
    if ((el = t.closest('#trades-btn'))) {
      state.tradePanelOpen = !state.tradePanelOpen;
      render(); return;
    }
    if ((el = t.closest('[data-trade-shift]'))) {
      state._tradeShiftDraft = el.getAttribute('data-trade-shift');
      render(); return;
    }
    if ((el = t.closest('#trade-save-btn'))) {
      var nameEl = document.getElementById('trade-name');
      var giveEl = document.getElementById('trade-give-date');
      var pickupEl = document.getElementById('trade-pickup-date');
      var shiftType = state._tradeShiftDraft || PICKUP_TYPES[0];
      var tradeOk = addTrade(nameEl ? nameEl.value : '', giveEl ? giveEl.value : '', pickupEl ? pickupEl.value : '', shiftType);
      if (tradeOk) { state.tradePanelOpen = false; state._tradeShiftDraft = null; render(); }
      return;
    }
    if ((el = t.closest('[data-remove-trade]'))) {
      removeTrade(el.getAttribute('data-remove-trade'));
      render(); return;
    }
    if ((el = t.closest('#note-save-btn'))) {
      var noteEl = document.getElementById('note-input');
      setNote(state.selected, noteEl ? noteEl.value : '');
      render(); return;
    }
    if ((el = t.closest('#note-clear-btn'))) {
      setNote(state.selected, '');
      render(); return;
    }

    if ((el = t.closest('#nav-prev'))) {
      state.expanded ? jumpYear(state.viewYear - 1) : goMonth(-1);
      render(); return;
    }
    if ((el = t.closest('#nav-next'))) {
      state.expanded ? jumpYear(state.viewYear + 1) : goMonth(1);
      render(); return;
    }
    if ((el = t.closest('#nav-today'))) {
      state.viewYear = today.getFullYear(); state.viewMonth = today.getMonth(); state.selected = today;
      render(); return;
    }
    if ((el = t.closest('#nav-expand'))) {
      state.expanded = !state.expanded;
      render(); return;
    }
    if ((el = t.closest('#year-toggle-btn'))) {
      state.yearPickerOpen = !state.yearPickerOpen;
      render(); return;
    }
    if ((el = t.closest('#year-step-up'))) {
      var inp = document.getElementById('year-input');
      inp.value = (parseInt(inp.value, 10) || state.viewYear) + 1;
      return;
    }
    if ((el = t.closest('#year-step-down'))) {
      var inp2 = document.getElementById('year-input');
      inp2.value = (parseInt(inp2.value, 10) || state.viewYear) - 1;
      return;
    }
    if ((el = t.closest('[data-year-off]'))) {
      var inp3 = document.getElementById('year-input');
      var base = parseInt(inp3.value, 10) || state.viewYear;
      jumpYear(base + parseInt(el.getAttribute('data-year-off'), 10));
      render(); return;
    }
    if ((el = t.closest('#year-this-year'))) {
      jumpYear(today.getFullYear());
      render(); return;
    }
    if ((el = t.closest('.day-btn'))) {
      state.selected = new Date(parseInt(el.getAttribute('data-ts'), 10));
      render(); return;
    }
    if ((el = t.closest('.mini-btn'))) {
      var d = new Date(parseInt(el.getAttribute('data-ts'), 10));
      state.selected = d;
      state.viewMonth = d.getMonth();
      state.viewYear = d.getFullYear();
      state.expanded = false;
      render(); return;
    }
  });

  // Commit year input on Enter
  document.getElementById('root').addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'year-input' && e.key === 'Enter') {
      var y = parseInt(e.target.value, 10);
      if (!isNaN(y) && y > 0) jumpYear(y);
      render();
    }
  });

  // Keep vacation date drafts in sync so they survive re-renders (e.g. switching person)
  document.getElementById('root').addEventListener('change', function (e) {
    if (e.target && e.target.id === 'vac-start') state._vacStartDraft = e.target.value;
    if (e.target && e.target.id === 'vac-end') state._vacEndDraft = e.target.value;
    if (e.target && e.target.id === 'import-file-input' && e.target.files && e.target.files[0]) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (importAppData(data)) render();
          else alert('That file doesn\u2019t look like a valid backup.');
        } catch (err) {
          alert('Couldn\u2019t read that file \u2014 make sure it\u2019s a backup exported from this calendar.');
        }
      };
      reader.readAsText(e.target.files[0]);
      e.target.value = '';
    }
  });

  // Commit year input on blur (unless blurring to a stepper/quick button, handled by their own click already firing first)
  document.getElementById('root').addEventListener('focusout', function (e) {
    if (e.target && e.target.id === 'year-input') {
      setTimeout(function () {
        if (!state.yearPickerOpen) return; // already handled by a button click
        var input = document.getElementById('year-input');
        if (!input) return;
        var y = parseInt(input.value, 10);
        if (!isNaN(y) && y > 0 && y !== state.viewYear) { jumpYear(y); render(); }
      }, 120);
    }
  });

  // Close popover when clicking outside it
  document.addEventListener('click', function (e) {
    if (!state.yearPickerOpen) return;
    var path = e.composedPath ? e.composedPath() : [];
    var insideWrap = path.some(function (el) { return el && el.id === 'year-wrap'; });
    if (!insideWrap) {
      state.yearPickerOpen = false;
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
