<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift Calendar</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Calendar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 500px at 50% -5%, #1B1E27 0%, #0A0B0F 55%, #050609 100%);
    color: #EDEBE4;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #root { padding: 40px 16px 72px; display: flex; flex-direction: column; align-items: center; }
  .wrap { width: 100%; max-width: 440px; transition: max-width 0.2s ease; }
  .wrap.expanded { max-width: 780px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #7D818C; font-weight: 600; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .eyebrow .line { width: 14px; height: 1px; background: #3A3D45; }
  .header-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-family: 'Bebas Neue', 'Inter', sans-serif; font-size: 56px; line-height: 0.85; margin: 0; letter-spacing: 0.01em; color: #F5F3ED; }
  .year-wrap { position: relative; }
  .year-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #9A9EA8; background: transparent;
    border: none; border-bottom: 1.5px solid #33363F; cursor: pointer; padding-bottom: 2px; letter-spacing: 0.02em;
  }
  .year-popover {
    position: absolute; right: 0; top: calc(100% + 10px); z-index: 10;
    background: #15171D; border: 1px solid #272A33; border-radius: 14px;
    padding: 14px; width: 200px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .step-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .step-btn {
    width: 26px; height: 26px; border-radius: 6px; background: #1B1D24; border: 1px solid #272A33;
    color: #B8BCC6; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  #year-input {
    flex: 1; text-align: center; font-size: 18px; font-weight: 700;
    background: #0D0E12; border: 1px solid #272A33; border-radius: 8px;
    color: #F5F3ED; padding: 6px 4px; width: 0;
  }
  #year-input::-webkit-outer-spin-button, #year-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .quick-btn {
    font-size: 12.5px; padding: 7px 0; border-radius: 7px; background: #1B1D24; border: 1px solid #272A33;
    color: #B8BCC6; cursor: pointer; font-weight: 600;
  }
  .this-year-btn { width: 100%; margin-top: 6px; font-weight: 700; }
  .cycle-strip { display: flex; gap: 3px; margin-bottom: 8px; }
  .cycle-seg { flex: 1; height: 22px; border-radius: 4px; }
  .cycle-label { font-size: 11.5px; color: #6E727C; letter-spacing: 0.02em; margin-bottom: 24px; }
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
  .nav-btn {
    width: 38px; height: 38px; border-radius: 10px; background: #15171D; border: 1px solid #22242B;
    color: #EDEBE4; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .nav-btn.wide { width: auto; padding: 0 18px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #B8BCC6; }
  .nav-btn.expand-on { color: #15171D; background: #F5A623; border-color: #F5A623; gap: 8px; }
  .nav-group { display: flex; gap: 8px; }
  .dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .dow-cell { text-align: center; font-size: 10.5px; color: #565A64; font-weight: 700; letter-spacing: 0.1em; padding: 4px 0; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 26px; }
  .day-btn {
    position: relative; aspect-ratio: 1; border-radius: 9px; border: 1.5px solid transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    font-size: 13.5px; font-weight: 600; transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .day-btn:hover { filter: brightness(1.15); }
  .day-btn.selected {
    border-color: #F5F3ED;
    border-width: 2.5px;
    box-shadow: 0 0 0 3px rgba(245, 243, 237, 0.22), 0 4px 14px rgba(0, 0, 0, 0.45);
    transform: scale(1.06);
    z-index: 2;
  }
  .day-btn.today { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
  .marker-dot {
    position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%;
    z-index: 3; box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
  }
  .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .mini-month { background: #101116; border: 1px solid #1E2027; border-radius: 12px; padding: 12px 12px 14px; }
  .mini-title { font-size: 12.5px; font-weight: 800; color: #B8BCC6; margin-bottom: 8px; letter-spacing: 0.03em; }
  .mini-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; }
  .mini-dow-cell { text-align: center; font-size: 8px; color: #4A4D56; font-weight: 700; letter-spacing: 0.02em; }
  .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .mini-btn {
    position: relative; aspect-ratio: 1; border-radius: 3px; border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600;
  }
  .mini-btn:hover { filter: brightness(1.3); }
  .mini-btn.selected {
    border: 1.5px solid #F5F3ED;
    box-shadow: 0 0 0 2px rgba(245, 243, 237, 0.25);
    transform: scale(1.15);
    z-index: 2;
  }
  .mini-btn.today { border: 1px solid #4E9BFF; font-weight: 800; }
  .detail-card {
    background: linear-gradient(160deg, #15171D 0%, #101116 100%); border: 1px solid #22242B; border-radius: 16px;
    padding: 18px 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px;
  }
  .detail-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .detail-date { font-size: 12.5px; color: #7D818C; margin-bottom: 3px; }
  .detail-label { font-size: 17px; font-weight: 800; color: #F5F3ED; }
  .detail-sub { font-size: 12.5px; color: #7D818C; margin-top: 1px; }
  .badge-row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 8px; }
  .crew-card {
    background: linear-gradient(165deg, #15171D 0%, #101116 100%);
    border: 1px solid #22242B; border-radius: 16px;
    padding: 16px 18px; margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .crew-title {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8F94A0; font-weight: 700;
    margin-bottom: 12px; display: flex; align-items: center; gap: 7px;
  }
  .crew-title-icon { display: inline-flex; color: #565A64; flex-shrink: 0; }
  .crew-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #1C1E24; }
  .crew-row:first-of-type { border-top: none; padding-top: 2px; }
  .crew-name { font-size: 13.5px; font-weight: 600; color: #C8CBD3; }
  .crew-name.you { color: #F5F3ED; font-weight: 800; }
  .crew-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
  .section-divider {
    display: flex; align-items: center; gap: 10px; margin: 28px 0 14px;
  }
  .section-divider .line { flex: 1; height: 1px; background: linear-gradient(90deg, #22242B, transparent); }
  .section-divider .line.right { background: linear-gradient(270deg, #22242B, transparent); }
  .section-divider span {
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #6E727C; font-weight: 700; white-space: nowrap;
  }
  .legend-row {
    display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    background: #101116; border: 1px solid #1E2027; border-radius: 14px; padding: 14px 16px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend-text { font-size: 12.5px; color: #9A9EA8; font-weight: 500; }
  .legend-count { font-size: 12.5px; color: #565A64; }
  .picker-wrap { width: 100%; max-width: 380px; text-align: center; padding-top: 40px; }
  .picker-sub { font-size: 14px; color: #9A9EA8; margin-bottom: 26px; }
  .picker-list { display: flex; flex-direction: column; gap: 10px; }
  .picker-btn {
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: #F5F3ED;
    background: #15171D; border: 1px solid #272A33; border-radius: 12px; padding: 16px;
    cursor: pointer; text-align: left;
  }
  .picker-btn:hover { border-color: #F5A623; }
  .picker-cancel { margin-top: 16px; background: transparent; border: none; color: #7D818C; font-size: 13px; cursor: pointer; }
  .switch-link { background: transparent; border: none; color: #7D818C; font-size: 11px; text-decoration: underline; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  // ---- Shift rule ----
  // Cycle: 8 day shifts, 4 off, 7 afternoon shifts, 2 off = 21 day cycle
  // Anchor: July 31, 2026 is day 0 of the cycle (first day of an 8-day DAY block)
  var ANCHOR = new Date(2026, 6, 31);
  var CYCLE_LEN = 21;
  var CREWS = [
    { id: 'cj', label: 'Chris/CJ', abbr: 'CJ', anchor: new Date(2026, 6, 31), members: [{ id: 'cj_chris', name: 'Chris' }, { id: 'cj_cj', name: 'CJ' }] },
    { id: 'ab', label: 'Allen/Brad', abbr: 'AB', anchor: new Date(2026, 7, 7), members: [{ id: 'ab_allen', name: 'Allen' }, { id: 'ab_brad', name: 'Brad' }] },
    { id: 'bj', label: 'Bill/Justin', abbr: 'BJ', anchor: new Date(2026, 6, 24), members: [{ id: 'bj_bill', name: 'Bill' }, { id: 'bj_justin', name: 'Justin' }] },
  ];
  var CYCLE_SEGMENTS = [
    { len: 8, type: 'day' },
    { len: 4, type: 'off' },
    { len: 7, type: 'afternoon' },
    { len: 2, type: 'off' },
  ];

  function daysBetween(a, b) {
    var ms = 24 * 60 * 60 * 1000;
    var ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / ms);
  }

  function cycleIndexFor(anchor, date) {
    var idx = daysBetween(anchor, date) % CYCLE_LEN;
    if (idx < 0) idx += CYCLE_LEN;
    return idx;
  }

  function shiftFromIndex(idx) {
    if (idx <= 7) return 'day';
    if (idx <= 11) return 'off';
    if (idx <= 18) return 'afternoon';
    return 'off';
  }

  function cycleIndex(date) { return cycleIndexFor(ANCHOR, date); }
  function getShift(date) { return shiftFromIndex(cycleIndex(date)); }
  function getShiftForCrew(crew, date) { return shiftFromIndex(cycleIndexFor(crew.anchor, date)); }

  // ---- Front/Back role rotation ----
  // Each crew's two members swap "Front" and "Back" jobs every time they return
  // from their 4-day break (i.e. at the day-block -> afternoon-block transition).
  // They do NOT swap after the short 2-day break (afternoon-block -> day-block).
  // Calibrated to a known fixed date rather than "today" (which changes) so it stays
  // correct regardless of when someone opens the page.
  var ROLE_CALIBRATION_DATE = new Date(2026, 7, 19); // Aug 19, 2026
  var BACK_PERSON_AT_CALIBRATION = { cj: 'cj_chris', ab: 'ab_allen', bj: 'bj_justin' };

  function toggleCount(anchor, date) {
    var idx = cycleIndexFor(anchor, date);
    var cycleNum = Math.floor(daysBetween(anchor, date) / CYCLE_LEN);
    return cycleNum + (idx >= 12 ? 1 : 0);
  }
  function roleForPerson(crew, personId, date) {
    var backId = BACK_PERSON_AT_CALIBRATION[crew.id];
    if (!backId) return null;
    var diff = toggleCount(crew.anchor, date) - toggleCount(crew.anchor, ROLE_CALIBRATION_DATE);
    var sameParity = ((diff % 2) + 2) % 2 === 0;
    var isBackAtCalibration = personId === backId;
    var isBackNow = sameParity ? isBackAtCalibration : !isBackAtCalibration;
    return isBackNow ? 'Back' : 'Front';
  }

  var SHIFT_META = {
    day: { label: 'Day shift', sub: '7:00a – 3:00p', color: '#F5A623' },
    afternoon: { label: 'Afternoon shift', sub: '3:00p – 11:00p', color: '#5C7CFA' },
    midnight: { label: 'Midnight shift', sub: '11:00p – 7:00a', color: '#8B5CF6' },
    off: { label: 'Off', sub: 'No shift scheduled', color: '#454A58' },
    vacation: { label: 'On vacation', sub: 'Not scheduled (vacation)', color: '#B565E8' },
  };
  var PICKUP_TYPES = ['day', 'afternoon', 'midnight'];

  var HOLIDAY_COLOR = '#F0386E';
  var PAYDAY_COLOR = '#22C55E';
  var OPENING_COLOR = '#FF4D5E';
  var PAY_ANCHOR = new Date(2026, 6, 31); // today is a payday; repeats every 14 days

  function isPayday(date) {
    var diff = daysBetween(PAY_ANCHOR, date) % 14;
    if (diff < 0) diff += 14;
    return diff === 0;
  }

  // ---- Pay period + overtime/double-time calculation ----
  // Pay period = 14 days (two Mon\u2013Sun weeks), ending the Sunday before payday.
  // Rules (as confirmed): >8 hrs in a single day = OT; 6th consecutive day worked
  // in a Mon\u2013Sun week = all hours that day at 1.5x; 7th consecutive day worked
  // in that week = all hours that day at 2x (double time).
  var SHIFT_HOURS = 8;
  var SUNDAY_PREMIUM_RATE = 2.50; // per hour, any hours worked on a Sunday
  var DEFAULT_RATE_HISTORY = [
    { id: 'r0', effective: Date.UTC(2020, 0, 1), rate: 37.97 },
    { id: 'r1', effective: Date.UTC(2026, 5, 1), rate: 42.09 }, // confirmed raise, effective Jun 1, 2026
  ];
  var PERIOD_REF_START = new Date(2026, 6, 13); // a known period start (Monday)
  var PERIOD_LEN = 14;

  function periodContaining(date) {
    var diff = daysBetween(PERIOD_REF_START, date);
    var periodIndex = Math.floor(diff / PERIOD_LEN);
    var start = new Date(PERIOD_REF_START);
    start.setDate(start.getDate() + periodIndex * PERIOD_LEN);
    var end = new Date(start);
    end.setDate(end.getDate() + 13);
    return { start: start, end: end };
  }

  function computePayPeriodHours(periodStart) {
    var weeks = [[], []];
    for (var i = 0; i < 14; i++) {
      var d = new Date(periodStart);
      d.setDate(d.getDate() + i);
      weeks[Math.floor(i / 7)].push(d);
    }

    var totals = { regular: 0, overtime: 0, doubleTime: 0, sundayHours: 0 };
    var days = [];

    weeks.forEach(function (week) {
      var workedOrdinal = 0;
      week.forEach(function (date) {
        var shift = myEffectiveShift(date);
        var scheduledWorked = shift === 'day' || shift === 'afternoon';
        var pickups = getPickups(date);
        var worked = scheduledWorked || pickups.length > 0;
        var entry = {
          date: date, worked: worked, shift: shift, pickups: pickups,
          regular: 0, overtime: 0, doubleTime: 0, hours: 0,
        };
        if (worked) {
          workedOrdinal++;
          var extraPickups = pickups.filter(function (t) { return t !== shift; });
          var hrs = (scheduledWorked ? SHIFT_HOURS : 0) + extraPickups.length * SHIFT_HOURS;
          entry.hours = hrs;
          var isHol = isHolidayDate(date);

          if (workedOrdinal === 7) {
            entry.doubleTime = hrs;
          } else if (workedOrdinal === 6 || isHol) {
            entry.overtime = hrs;
          } else {
            entry.regular = Math.min(hrs, 8);
            entry.overtime = Math.max(0, hrs - 8);
          }
          totals.regular += entry.regular;
          totals.overtime += entry.overtime;
          totals.doubleTime += entry.doubleTime;
          if (date.getDay() === 0) totals.sundayHours += hrs;
        }
        days.push(entry);
      });
    });

    return { totals: totals, days: days };
  }

  function computeYTDHours(uptoDate) {
    var year = uptoDate.getFullYear();
    var firstPeriod = periodContaining(new Date(year, 0, 1));
    var targetPeriod = periodContaining(uptoDate);
    var totals = { regular: 0, overtime: 0, doubleTime: 0 };
    var periodCount = 0;
    var cursor = new Date(firstPeriod.start);
    while (cursor.getTime() <= targetPeriod.start.getTime()) {
      var r = computePayPeriodHours(cursor);
      totals.regular += r.totals.regular;
      totals.overtime += r.totals.overtime;
      totals.doubleTime += r.totals.doubleTime;
      periodCount++;
      cursor.setDate(cursor.getDate() + 14);
    }
    return { totals: totals, periodCount: periodCount, from: firstPeriod.start, through: targetPeriod.end };
  }

  function computeGrossPay(totals, periodStart) {
    var baseRate = getBaseRateFor(periodStart);
    var otRate = baseRate * 1.5;
    var dtRate = baseRate * 2;
    var regularPay = totals.regular * baseRate;
    var otPay = totals.overtime * otRate;
    var dtPay = totals.doubleTime * dtRate;
    var sundayPay = totals.sundayHours * SUNDAY_PREMIUM_RATE;
    return {
      baseRate: baseRate, otRate: otRate, dtRate: dtRate,
      regularPay: regularPay, otPay: otPay, dtPay: dtPay, sundayPay: sundayPay,
      total: regularPay + otPay + dtPay + sundayPay,
    };
  }

  // ---- Take-home pay + 401k ----
  // Calibrated across 6 real pay stubs (Dec 2025 \u2013 Aug 2026), spanning gross
  // pay from ~$3,966 to ~$10,893, so this holds up much better across both
  // light and heavy-OT pay periods than a single flat-percentage estimate would.
  var PAY_RATES = {
    k401EmployeeRate: 0.11937,      // 401K / gross (consistent across all post-raise stubs)
    k401EmployerMatchRatio: 1 / 3,  // employer $ per employee $ (confirmed exactly 1/3 across 4 stubs)
    oasdiRate: 0.062,               // statutory, applied to (gross - flat pretax benefits) \u2014 confirmed exact
    medicareRate: 0.0145,           // statutory, same base \u2014 confirmed exact
    // Federal/state withholding modeled as linear functions of gross pay (IRS percentage-method
    // withholding is progressive, so a flat % badly over/under-shoots on unusual OT periods).
    // Fit via linear regression across all 6 stubs; negative results are clamped to $0.
    fedSlope: 0.22624,
    fedIntercept: -440.18,
    stateSlope: 0.03164,
    stateIntercept: -37.52,
    flatPreTax: 103.23,   // Dental + HDHP Medical + HSA (flat premiums each period)
    flatPostTax: 30.00,   // Union Dues \u2014 actually alternates ~$60/$0 by period, averages to ~$30
  };

  function computeTakeHome(grossTotal) {
    var k401Employee = grossTotal * PAY_RATES.k401EmployeeRate;
    var k401Employer = k401Employee * PAY_RATES.k401EmployerMatchRatio;
    var ficaBase = Math.max(0, grossTotal - PAY_RATES.flatPreTax);
    var oasdi = ficaBase * PAY_RATES.oasdiRate;
    var medicare = ficaBase * PAY_RATES.medicareRate;
    var fed = Math.max(0, grossTotal * PAY_RATES.fedSlope + PAY_RATES.fedIntercept);
    var state = Math.max(0, grossTotal * PAY_RATES.stateSlope + PAY_RATES.stateIntercept);
    var preTax = k401Employee + PAY_RATES.flatPreTax;
    var taxes = oasdi + medicare + fed + state;
    var postTax = PAY_RATES.flatPostTax;
    var net = grossTotal - preTax - taxes - postTax;
    return {
      k401Employee: k401Employee, k401Employer: k401Employer,
      oasdi: oasdi, medicare: medicare, fed: fed, state: state,
      flatPreTax: PAY_RATES.flatPreTax, flatPostTax: postTax,
      taxes: taxes, preTax: preTax, postTax: postTax, net: net,
    };
  }

  function buildSplitBackground(baseColor, accents) {
    if (accents.length === 0) return baseColor;
    var stops = [baseColor].concat(accents);
    var n = stops.length;
    var pct = 100 / n;
    var parts = stops.map(function (c, i) { return c + ' ' + (i * pct) + '%, ' + c + ' ' + ((i + 1) * pct) + '%'; });
    return 'linear-gradient(135deg, ' + parts.join(', ') + ')';
  }

  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

  function buildMonthGrid(year, month) {
    var startWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < startWeekday; i++) cells.push(null);
    for (var d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }

  function isSameDay(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function dateKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }

  function getEaster(year) {
    var a = year % 19, b = Math.floor(year / 100), c = year % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    var h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4;
    var l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31);
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }

  function nthWeekday(year, month, weekday, n) {
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var count = 0;
    for (var d = 1; d <= daysInMonth; d++) {
      var date = new Date(year, month, d);
      if (date.getDay() === weekday) { count++; if (count === n) return date; }
    }
    return null;
  }

  function lastWeekday(year, month, weekday) {
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var d = daysInMonth; d >= 1; d--) {
      var date = new Date(year, month, d);
      if (date.getDay() === weekday) return date;
    }
    return null;
  }

  function buildHolidayMap(year) {
    var easter = getEaster(year);
    var goodFriday = new Date(easter); goodFriday.setDate(easter.getDate() - 2);
    var thanksgiving = nthWeekday(year, 10, 4, 4);
    var dayAfterThanksgiving = new Date(thanksgiving); dayAfterThanksgiving.setDate(thanksgiving.getDate() + 1);
    var list = [
      { date: new Date(year, 0, 1), name: "New Year's Day" },
      { date: nthWeekday(year, 1, 1, 3), name: "President's Day" },
      { date: goodFriday, name: 'Good Friday' },
      { date: lastWeekday(year, 4, 1), name: 'Decoration Day' },
      { date: new Date(year, 6, 4), name: 'Independence Day' },
      { date: nthWeekday(year, 8, 1, 1), name: 'Labor Day' },
      { date: new Date(year, 10, 11), name: "Veterans' Day" },
      { date: thanksgiving, name: 'Thanksgiving Day' },
      { date: dayAfterThanksgiving, name: 'Friday after Thanksgiving' },
      { date: new Date(year, 11, 24), name: 'Christmas Eve' },
      { date: new Date(year, 11, 25), name: 'Christmas Day' },
    ];
    var map = {};
    list.forEach(function (h) { map[dateKey(h.date)] = h.name; });
    return map;
  }
  function isHolidayDate(date) {
    return !!buildHolidayMap(date.getFullYear())[dateKey(date)];
  }

  // ---- Icons (inline SVG, no external deps) ----

  };
  function cardIcon(iconKey) { return '<span class="crew-title-icon">' + ICON[iconKey] + '</span>'; }
  function sunIcon(color, size) {

      '<line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>' +
      '<line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/></svg>';

  function moonIcon(color, size) {

  // ---- State ----
  var today = new Date();

  var state = {
    viewYear: today.getFullYear(),
    viewMonth: today.getMonth(),
    selected: today,
    yearPickerOpen: false,
    expanded: false,
    myCrew: 'cj',
    vacations: [],
    vacationPanelOpen: false,
    notes: {},
    pickups: {},
    rateHistory: [],
    ratePanelOpen: false,
  };
  state.vacations = loadVacations();
  state.notes = loadNotes();
  state.pickups = loadPickups();
  state.rateHistory = loadRateHistory();

  function getCrew(id) {
    for (var i = 0; i < CREWS.length; i++) if (CREWS[i].id === id) return CREWS[i];
    return null;
  }
  function myAnchor() {
    var c = getCrew(state.myCrew);
    return c ? c.anchor : CREWS[0].anchor;
  }
  function myShift(date) { return shiftFromIndex(cycleIndexFor(myAnchor(), date)); }
  function myCycleIndex(date) { return cycleIndexFor(myAnchor(), date); }

  // ---- Vacations (per-person, stored locally on this device only) ----
  // ---- Cloud sync (so this isn't stuck on one device/browser) ----
  // Uses jsonblob.com, a free no-signup JSON store. Your data's "location" is a
  // blob ID that gets added to the page URL as ?data=ID — bookmark that URL (or
  // save it somewhere) to access the same data from any device/browser.
  var SYNC_BASE = 'https://jsonblob.com/api/jsonBlob';
  var syncBlobId = null;
  var syncStatus = 'idle'; // idle | syncing | synced | error
  try {
    var urlParams = new URLSearchParams(window.location.search);
    syncBlobId = urlParams.get('data') || localStorage.getItem('shiftcal_blob_id') || null;
  } catch (e) { syncBlobId = null; }

  function cloudPayload() {
    return { vacations: state.vacations, notes: state.notes, pickups: state.pickups, rateHistory: state.rateHistory };
  }

  function pushToCloud() {
    if (!syncBlobId) return;
    syncStatus = 'syncing';
    fetch(SYNC_BASE + '/' + syncBlobId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cloudPayload()),
    }).then(function (res) {
      syncStatus = res.ok ? 'synced' : 'error';
      render();
    }).catch(function () { syncStatus = 'error'; render(); });
  }

  function createCloudBlob() {
    syncStatus = 'syncing';
    fetch(SYNC_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cloudPayload()),
    }).then(function (res) {
      var loc = res.headers.get('Location');
      if (loc) {
        var id = loc.split('/').pop();
        syncBlobId = id;
        try { localStorage.setItem('shiftcal_blob_id', id); } catch (e) {}
        try {
          var url = new URL(window.location.href);
          url.searchParams.set('data', id);
          window.history.replaceState({}, '', url);
        } catch (e) {}
        syncStatus = 'synced';
      } else {
        syncStatus = 'error';
      }
      render();
    }).catch(function () { syncStatus = 'error'; render(); });
  }

  function loadFromCloud(cb) {
    if (!syncBlobId) { cb(); return; }
    syncStatus = 'syncing';
    fetch(SYNC_BASE + '/' + syncBlobId)
      .then(function (res) { if (!res.ok) throw new Error('not found'); return res.json(); })
      .then(function (data) {
        if (data && data.vacations) state.vacations = data.vacations;
        if (data && data.notes) state.notes = data.notes;
        if (data && data.pickups) state.pickups = data.pickups;
        if (data && data.rateHistory && data.rateHistory.length) state.rateHistory = data.rateHistory;
        try { localStorage.setItem('shiftcal_vacations', JSON.stringify(state.vacations)); } catch (e) {}
        try { localStorage.setItem('shiftcal_notes', JSON.stringify(state.notes)); } catch (e) {}
        try { localStorage.setItem('shiftcal_pickups', JSON.stringify(state.pickups)); } catch (e) {}
        try { localStorage.setItem('shiftcal_rates', JSON.stringify(state.rateHistory)); } catch (e) {}
        syncStatus = 'synced';
        cb();
      })
      .catch(function () { syncStatus = 'error'; cb(); });
  }

  function loadVacations() {
    try {
      var raw = localStorage.getItem('shiftcal_vacations');
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return parsed.map(function (v) { return { id: v.id, personId: v.personId, start: v.start, end: v.end }; });
    } catch (e) { return []; }
  }
  function saveVacations() {
    try { localStorage.setItem('shiftcal_vacations', JSON.stringify(state.vacations)); } catch (e) {}
    if (syncBlobId) pushToCloud(); else createCloudBlob();
  }
  function dateOnlyTs(d) { return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); }
  function getPerson(personId) {
    for (var i = 0; i < CREWS.length; i++) {
      var m = CREWS[i].members.find(function (m) { return m.id === personId; });
      if (m) return m;
    }
    return null;
  }
  function isPersonOnVacation(personId, date) {
    var t = dateOnlyTs(date);
    for (var i = 0; i < state.vacations.length; i++) {
      var v = state.vacations[i];
      if (v.personId === personId && t >= v.start && t <= v.end) return true;
    }
    return false;
  }
  function membersOnVacation(crew, date) {
    return crew.members.filter(function (m) { return isPersonOnVacation(m.id, date); });
  }
  function crewFullyOut(crew, date) {
    return crew.members.every(function (m) { return isPersonOnVacation(m.id, date); });
  }
  function effectiveShiftForCrew(crew, date) {
    if (crewFullyOut(crew, date)) return 'vacation';
    return getShiftForCrew(crew, date);
  }
  function myEffectiveShift(date) {
    var c = getCrew(state.myCrew);
    return c ? effectiveShiftForCrew(c, date) : myShift(date);
  }
  // Returns array of { shift: 'day'|'afternoon', crew, missing: [members], needed: 1 or 2 }
  function getOpenings(date) {
    var openings = [];
    CREWS.forEach(function (crew) {
      var raw = getShiftForCrew(crew, date);
      if (raw !== 'day' && raw !== 'afternoon') return;
      var missing = membersOnVacation(crew, date);
      if (missing.length > 0) {
        openings.push({ shift: raw, crew: crew, missing: missing, needed: missing.length });
      }
    });
    return openings;
  }
  function addVacation(personId, startStr, endStr) {
    if (!personId || !startStr || !endStr) return false;
    var s = new Date(startStr + 'T00:00:00');
    var e = new Date(endStr + 'T00:00:00');
    if (isNaN(s) || isNaN(e) || e < s) return false;
    state.vacations.push({ id: 'v' + Date.now(), personId: personId, start: dateOnlyTs(s), end: dateOnlyTs(e) });
    saveVacations();
    return true;
  }
  function updateVacation(id, personId, startStr, endStr) {
    if (!personId || !startStr || !endStr) return false;
    var s = new Date(startStr + 'T00:00:00');
    var e = new Date(endStr + 'T00:00:00');
    if (isNaN(s) || isNaN(e) || e < s) return false;
    var v = state.vacations.find(function (v) { return v.id === id; });
    if (!v) return false;
    v.personId = personId; v.start = dateOnlyTs(s); v.end = dateOnlyTs(e);
    saveVacations();
    return true;
  }
  function removeVacation(id) {
    state.vacations = state.vacations.filter(function (v) { return v.id !== id; });
    saveVacations();
  }

  // ---- Daily notes (stored locally on this device only) ----
  function loadNotes() {
    try {
      var raw = localStorage.getItem('shiftcal_notes');
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveNotes() {
    try { localStorage.setItem('shiftcal_notes', JSON.stringify(state.notes)); } catch (e) {}
    if (syncBlobId) pushToCloud(); else createCloudBlob();
  }
  function getNote(date) { return state.notes[dateKey(date)] || ''; }
  function setNote(date, text) {
    var key = dateKey(date);
    text = (text || '').trim();
    if (text) state.notes[key] = text;
    else delete state.notes[key];
    saveNotes();
  }

  // ---- Picked-up shifts (extra shifts beyond your normal rotation) ----
  function loadPickups() {
    try {
      var raw = localStorage.getItem('shiftcal_pickups');
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function savePickups() {
    try { localStorage.setItem('shiftcal_pickups', JSON.stringify(state.pickups)); } catch (e) {}
    if (syncBlobId) pushToCloud(); else createCloudBlob();
  }
  function getPickups(date) { return state.pickups[dateKey(date)] || []; }
  function togglePickup(date, type) {
    var key = dateKey(date);
    var list = state.pickups[key] || [];
    var idx = list.indexOf(type);
    if (idx === -1) list = list.concat([type]);
    else list = list.filter(function (t) { return t !== type; });
    if (list.length) state.pickups[key] = list;
    else delete state.pickups[key];
    savePickups();
  }

  // ---- Pay rate history (so raises don't distort past pay periods) ----
  function loadRateHistory() {
    try {
      var raw = localStorage.getItem('shiftcal_rates');
      var parsed = raw ? JSON.parse(raw) : null;
      if (!parsed || !parsed.length) return DEFAULT_RATE_HISTORY.slice();
      return parsed;
    } catch (e) { return DEFAULT_RATE_HISTORY.slice(); }
  }
  function saveRateHistory() {
    try { localStorage.setItem('shiftcal_rates', JSON.stringify(state.rateHistory)); } catch (e) {}
    if (syncBlobId) pushToCloud(); else createCloudBlob();
  }
  function sortedRateHistory() {
    return state.rateHistory.slice().sort(function (a, b) { return a.effective - b.effective; });
  }
  function getBaseRateFor(date) {
    var sorted = sortedRateHistory();
    var t = dateOnlyTs(date);
    var applicable = sorted[0] ? sorted[0].rate : 42.09;
    for (var i = 0; i < sorted.length; i++) {
      if (sorted[i].effective <= t) applicable = sorted[i].rate;
      else break;
    }
    return applicable;
  }
  function addRateChange(effectiveStr, rateStr) {
    var d = new Date(effectiveStr + 'T00:00:00');
    var rate = parseFloat(rateStr);
    if (isNaN(d.getTime()) || isNaN(rate) || rate <= 0) return false;
    state.rateHistory.push({ id: 'rate' + Date.now(), effective: dateOnlyTs(d), rate: rate });
    saveRateHistory();
    return true;
  }
  function removeRateChange(id) {
    if (state.rateHistory.length <= 1) return; // keep at least one rate on record
    state.rateHistory = state.rateHistory.filter(function (r) { return r.id !== id; });
    saveRateHistory();
  }

  function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render() {
    var root = document.getElementById('root');
    var holidayMap = buildHolidayMap(state.viewYear);
    function holidayName(date) { return holidayMap[dateKey(date)] || null; }

    var selectedShift = myEffectiveShift(state.selected);
    var selIdx = myCycleIndex(state.selected);

    var html = '';
    html += '<div class="wrap' + (state.expanded ? ' expanded' : '') + '">';

    // Eyebrow
    html += '<div class="eyebrow"><span class="line"></span>Rotation · 8 on · 4 off · 7 on · 2 off</div>';
    var syncLabel = syncStatus === 'syncing' ? 'Syncing\u2026' : syncStatus === 'error' ? 'Sync error \u2014 saved on this device only' : syncBlobId ? 'Synced' : 'Not synced yet';
    var syncColor = syncStatus === 'error' ? OPENING_COLOR : syncBlobId ? PAYDAY_COLOR : '#565A64';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">';
    html += '<span style="width:6px;height:6px;border-radius:50%;background:' + syncColor + ';flex-shrink:0;"></span>';
    html += '<span style="font-size:11px;color:#7D818C;">' + syncLabel + '</span>';
    if (syncBlobId) html += '<button class="switch-link" id="copy-link-btn" style="margin-left:auto;">Copy sync link</button>';
    html += '</div>';

    // Header
    html += '<div class="header-row">';
    html += '<h1>' + (state.expanded ? 'Year overview' : MONTH_NAMES[state.viewMonth]) + '</h1>';
    html += '<div class="year-wrap" id="year-wrap">';
    html += '<button class="year-btn" id="year-toggle-btn">' + state.viewYear + '</button>';
    if (state.yearPickerOpen) {
      html += '<div class="year-popover" id="year-popover">';
      html += '<div class="step-row">';
      html += '<button class="step-btn" id="year-step-down">' + ICON.chevronDown + '</button>';
      html += '<input type="number" id="year-input" value="' + state.viewYear + '" />';
      html += '<button class="step-btn" id="year-step-up">' + ICON.chevronUp + '</button>';
      html += '</div>';
      html += '<div class="quick-grid">';
      [-5, -1, 1, 5].forEach(function (off) {
        html += '<button class="quick-btn" data-year-off="' + off + '">' + (off > 0 ? '+' + off : off) + '</button>';
      });
      html += '</div>';
      html += '<button class="quick-btn this-year-btn" id="year-this-year">This year</button>';
      html += '</div>';
    }
    html += '</div></div>';

    // Cycle strip
    html += '<div class="cycle-strip">';
    for (var ci = 0; ci < CYCLE_LEN; ci++) {
      var type = 'off', acc = 0;
      for (var s = 0; s < CYCLE_SEGMENTS.length; s++) {
        if (ci < acc + CYCLE_SEGMENTS[s].len) { type = CYCLE_SEGMENTS[s].type; break; }
        acc += CYCLE_SEGMENTS[s].len;
      }
      var marked = ci === selIdx;
      var bg = type === 'off' ? '#22242B' : SHIFT_META[type].color;
      html += '<div class="cycle-seg" style="background:' + bg + ';opacity:' + (type === 'off' ? 1 : 0.85) + ';outline:' + (marked ? '2px solid #F5F3ED' : 'none') + ';outline-offset:1px;"></div>';
    }
    html += '</div>';
    html += '<div class="cycle-label">Day ' + (selIdx + 1) + ' of ' + CYCLE_LEN + ' in the rotation — ' + SHIFT_META[selectedShift].label.toLowerCase() + '</div>';

    // Nav row
    html += '<div class="nav-row">';
    html += '<button class="nav-btn" id="nav-prev">' + ICON.chevronLeft + '</button>';
    html += '<div class="nav-group">';
    html += '<button class="nav-btn wide" id="nav-today">Today</button>';
    html += '<button class="nav-btn wide' + (state.expanded ? ' expand-on' : '') + '" id="nav-expand">' + (state.expanded ? ICON.calendarDays : ICON.layoutGrid) + '&nbsp;' + (state.expanded ? 'Month view' : 'Full year') + '</button>';
    html += '</div>';
    html += '<button class="nav-btn" id="nav-next">' + ICON.chevronRight + '</button>';
    html += '</div>';

    if (!state.expanded) {
      // Weekday row
      html += '<div class="dow-row">';
      DOW.forEach(function (d) { html += '<div class="dow-cell">' + d + '</div>'; });
      html += '</div>';

      // Month grid
      var grid = buildMonthGrid(state.viewYear, state.viewMonth);
      var counts = { day: 0, afternoon: 0, off: 0 };
      grid.forEach(function (d) { if (d) counts[myShift(d)]++; });

      html += '<div class="month-grid">';
      grid.forEach(function (date) {
        if (!date) { html += '<div></div>'; return; }
        var shift = myEffectiveShift(date);
        var meta = SHIFT_META[shift];
        var isToday = isSameDay(date, today);
        var isSelected = isSameDay(date, state.selected);
        var hName = holidayName(date);
        var pDay = isPayday(date);
        var opens = getOpenings(date);
        var hasOpening = opens.length > 0;
        var hasNote = !!getNote(date);
        var datePickups = getPickups(date);
        var hasPickup = datePickups.length > 0;
        var hasMarker = hName || pDay || hasOpening;
        var baseColor = shift === 'off' ? '#15171D' : meta.color;
        var accents = [];

        if (pDay) accents.push(PAYDAY_COLOR);
        if (hasOpening) accents.push(OPENING_COLOR);
        var bg = buildSplitBackground(baseColor, accents);
        var textColor = hasMarker ? '#15171D' : (shift === 'off' ? '#6E727C' : '#15171D');
        var textShadow = hasMarker ? '0 0 3px rgba(245,243,237,0.5)' : 'none';
        var titleAttr = [];
        if (hName) titleAttr.push(hName);
        if (pDay) titleAttr.push('Payday');
        if (hasOpening) titleAttr.push(opens.map(function (o) {
          return (o.shift === 'day' ? 'Day' : 'Afternoon') + ' shift needs ' + o.needed + ' (' +
            o.missing.map(function (m) { return m.name + ' (' + roleForPerson(o.crew, m.id, date) + ')'; }).join(', ') + ' out)';
        }).join(', '));
        if (hasNote) titleAttr.push('Note added');
        if (hasPickup) titleAttr.push('Picked up: ' + datePickups.join(', '));
        html += '<button class="day-btn' + (isSelected ? ' selected' : '') + (isToday ? ' today' : '') +
          '" data-ts="' + date.getTime() + '" title="' + escapeAttr(titleAttr.join(' · ')) +
          '" style="background:' + bg + ';color:' + textColor + ';text-shadow:' + textShadow + ';opacity:' + (shift === 'off' && !hasMarker ? 1 : (isSelected || hasMarker ? 1 : 0.88)) + ';">' +

    });
    html += '</div>';
    if (state.ratePanelOpen) {
      html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #1E2027;">';
      html += '<div style="font-size:12px;color:#9A9EA8;margin-bottom:8px;font-weight:600;">Add a rate change (e.g. a raise)</div>';
      html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;">';
      html += '<input type="date" id="rate-eff-date" style="flex:1;background:#0D0E12;border:1px solid #272A33;border-radius:8px;color:#F5F3ED;padding:8px;font-size:13px;">';
      html += '<input type="number" step="0.01" id="rate-value" placeholder="$/hr" style="width:90px;background:#0D0E12;border:1px solid #272A33;border-radius:8px;color:#F5F3ED;padding:8px;font-size:13px;">';
      html += '</div>';
      html += '<button class="quick-btn" id="rate-add-btn" style="width:100%;font-weight:700;">Save rate change</button>';
      html += '</div>';
    }
    html += '</div>';

    html += '</div>'; // .wrap

    root.innerHTML = html;
  }

  function goMonth(delta) {
    var m = state.viewMonth + delta, y = state.viewYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    state.viewMonth = m; state.viewYear = y;
  }

  function jumpYear(y) {
    state.viewYear = y;
    state.yearPickerOpen = false;
  }

  // ---- Event delegation (attached once; survives re-renders since #root persists) ----
  document.getElementById('root').addEventListener('click', function (e) {
    var t = e.target;
    var el;

    if ((el = t.closest('#copy-link-btn'))) {
      try {
        navigator.clipboard.writeText(window.location.href);
        el.textContent = 'Copied!';
        setTimeout(function () { render(); }, 1200);
      } catch (e) {}
      return;
    }
    if ((el = t.closest('#rates-btn'))) {
      state.ratePanelOpen = !state.ratePanelOpen;
      render(); return;
    }
    if ((el = t.closest('#rate-add-btn'))) {
      var effEl = document.getElementById('rate-eff-date');
      var valEl = document.getElementById('rate-value');
      var added = addRateChange(effEl ? effEl.value : '', valEl ? valEl.value : '');
      if (added) render();
      return;
    }
    if ((el = t.closest('[data-remove-rate]'))) {
      removeRateChange(el.getAttribute('data-remove-rate'));
      render(); return;
    }
    if ((el = t.closest('#vacations-btn'))) {
      state.vacationPanelOpen = !state.vacationPanelOpen;
      render(); return;
    }
    if ((el = t.closest('[data-vac-person]'))) {
      state._vacPersonDraft = el.getAttribute('data-vac-person');
      render(); return;
    }
    if ((el = t.closest('#vac-add-btn'))) {
      var startEl = document.getElementById('vac-start');
      var endEl = document.getElementById('vac-end');
      var personId = state._vacPersonDraft;
      var sVal = startEl ? startEl.value : '';
      var eVal = endEl ? endEl.value : '';
      var ok;
      if (state._vacEditingId) {
        ok = personId ? updateVacation(state._vacEditingId, personId, sVal, eVal) : false;
      } else {
        ok = personId ? addVacation(personId, sVal, eVal) : false;
      }
      if (ok) {
        state._vacPersonDraft = null; state._vacStartDraft = null; state._vacEndDraft = null; state._vacEditingId = null;
        render();
      }
      return;
    }
    if ((el = t.closest('#vac-cancel-edit-btn'))) {
      state._vacEditingId = null; state._vacPersonDraft = null; state._vacStartDraft = null; state._vacEndDraft = null;
      render(); return;
    }
    if ((el = t.closest('[data-edit-vacation]'))) {
      var editId = el.getAttribute('data-edit-vacation');
      var v = state.vacations.find(function (v) { return v.id === editId; });
      if (v) {
        state._vacEditingId = editId;
        state._vacPersonDraft = v.personId;
        state._vacStartDraft = new Date(v.start).toISOString().slice(0, 10);
        state._vacEndDraft = new Date(v.end).toISOString().slice(0, 10);
        render();
      }
      return;
    }
    if ((el = t.closest('[data-remove-vacation]'))) {
      removeVacation(el.getAttribute('data-remove-vacation'));
      if (state._vacEditingId === el.getAttribute('data-remove-vacation')) {
        state._vacEditingId = null; state._vacPersonDraft = null; state._vacStartDraft = null; state._vacEndDraft = null;
      }
      render(); return;
    }
    if ((el = t.closest('[data-toggle-pickup]'))) {
      togglePickup(state.selected, el.getAttribute('data-toggle-pickup'));
      render(); return;
    }
    if ((el = t.closest('#note-save-btn'))) {
      var noteEl = document.getElementById('note-input');
      setNote(state.selected, noteEl ? noteEl.value : '');
      render(); return;
    }
    if ((el = t.closest('#note-clear-btn'))) {
      setNote(state.selected, '');
      render(); return;
    }

    if ((el = t.closest('#nav-prev'))) {
      state.expanded ? jumpYear(state.viewYear - 1) : goMonth(-1);
      render(); return;
    }
    if ((el = t.closest('#nav-next'))) {
      state.expanded ? jumpYear(state.viewYear + 1) : goMonth(1);
      render(); return;
    }
    if ((el = t.closest('#nav-today'))) {
      state.viewYear = today.getFullYear(); state.viewMonth = today.getMonth(); state.selected = today;
      render(); return;
    }
    if ((el = t.closest('#nav-expand'))) {
      state.expanded = !state.expanded;
      render(); return;
    }
    if ((el = t.closest('#year-toggle-btn'))) {
      state.yearPickerOpen = !state.yearPickerOpen;
      render(); return;
    }
    if ((el = t.closest('#year-step-up'))) {
      var inp = document.getElementById('year-input');
      inp.value = (parseInt(inp.value, 10) || state.viewYear) + 1;
      return;
    }
    if ((el = t.closest('#year-step-down'))) {
      var inp2 = document.getElementById('year-input');
      inp2.value = (parseInt(inp2.value, 10) || state.viewYear) - 1;
      return;
    }
    if ((el = t.closest('[data-year-off]'))) {
      var inp3 = document.getElementById('year-input');
      var base = parseInt(inp3.value, 10) || state.viewYear;
      jumpYear(base + parseInt(el.getAttribute('data-year-off'), 10));
      render(); return;
    }
    if ((el = t.closest('#year-this-year'))) {
      jumpYear(today.getFullYear());
      render(); return;
    }
    if ((el = t.closest('.day-btn'))) {
      state.selected = new Date(parseInt(el.getAttribute('data-ts'), 10));
      render(); return;
    }
    if ((el = t.closest('.mini-btn'))) {
      var d = new Date(parseInt(el.getAttribute('data-ts'), 10));
      state.selected = d;
      state.viewMonth = d.getMonth();
      state.viewYear = d.getFullYear();
      state.expanded = false;
      render(); return;
    }
  });

  // Commit year input on Enter
  document.getElementById('root').addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'year-input' && e.key === 'Enter') {
      var y = parseInt(e.target.value, 10);
      if (!isNaN(y) && y > 0) jumpYear(y);
      render();
    }
  });

  // Keep vacation date drafts in sync so they survive re-renders (e.g. switching person)
  document.getElementById('root').addEventListener('change', function (e) {
    if (e.target && e.target.id === 'vac-start') state._vacStartDraft = e.target.value;
    if (e.target && e.target.id === 'vac-end') state._vacEndDraft = e.target.value;
  });

  // Commit year input on blur (unless blurring to a stepper/quick button, handled by their own click already firing first)
  document.getElementById('root').addEventListener('focusout', function (e) {
    if (e.target && e.target.id === 'year-input') {
      setTimeout(function () {
        if (!state.yearPickerOpen) return; // already handled by a button click
        var input = document.getElementById('year-input');
        if (!input) return;
        var y = parseInt(input.value, 10);
        if (!isNaN(y) && y > 0 && y !== state.viewYear) { jumpYear(y); render(); }
      }, 120);
    }
  });

  // Close popover when clicking outside it
  document.addEventListener('click', function (e) {
    if (!state.yearPickerOpen) return;
    var path = e.composedPath ? e.composedPath() : [];
    var insideWrap = path.some(function (el) { return el && el.id === 'year-wrap'; });
    if (!insideWrap) {
      state.yearPickerOpen = false;
      render();
    }
  });

  render();

  // Sync with cloud after first paint: pull latest if we have a blob, otherwise create one
  if (syncBlobId) {
    loadFromCloud(function () { render(); });
  } else {
    createCloudBlob();
  }
})();
</script>
</body>
</html>
